name: Build Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile etheria_gear.py --name etheria_gear --clean

      - name: Smoke test EXE
        run: |
          .\dist\etheria_gear.exe --help
          .\dist\etheria_gear.exe parse --help

      - name: Generate checksum
        run: |
          $hash = (Get-FileHash dist/etheria_gear.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  etheria_gear.exe" | Out-File -FilePath dist/etheria_gear.exe.sha256 -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etheria_gear-exe
          path: |
            dist/etheria_gear.exe
            dist/etheria_gear.exe.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/etheria_gear.exe
            dist/etheria_gear.exe.sha256
